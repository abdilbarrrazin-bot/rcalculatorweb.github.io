<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javascript Learning</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="main.css">
</head>
<body id="content">

    <main class="panel">

        <header class="panel__header">
            <p class="prompt"><span class="prompt__symbol">&gt;</span> calculator_web<span class="cursor">_</span></p>

            <div class="mode-switch" role="group" aria-label="Tampilan">
                <button type="button" onclick="terangkan()">Light</button>
                <button type="button" onclick="gelapkan()">Dark</button>
            </div>
        </header>

        <section class="card">
            <h1 class="card__title">Kalkulator Sederhana</h1>

            <div class="field-row">
                <div class="field">
                    <label for="angka_pertama">Angka pertama</label>
                    <input type="number" id="angka_pertama" placeholder="0">
                </div>
                <div class="field">
                    <label for="angka_kedua">Angka kedua</label>
                    <input type="number" id="angka_kedua" placeholder="0">
                </div>
            </div>

            <div class="ops">
                <button type="button" onclick="tambah()">+</button>
                <button type="button" onclick="kurang()">&minus;</button>
                <button type="button" onclick="kali()">&times;</button>
                <button type="button" onclick="bagi()">&divide;</button>
                <button type="button" onclick="modulus()">%</button>
            </div>

            <div class="readout">
                <span class="readout__label">hasil</span>
                <div id="hasil" class="readout__value">0</div>
            </div>
        </section>

    </main>

    <script src="main.js"></script>
</body>
</html>
